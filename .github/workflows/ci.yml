name: CI

on:
  push:
    branches: [main, "flowwise-*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

  android:
    name: Android assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pinned Gradle (AGP 8.5.2 needs 8.7+). The wrapper can be generated
      # locally with `gradle wrapper`; CI uses the pinned distribution.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      # Phase 7: offline distribution — every CI run ships the APK as a
      # downloadable artifact (the till team side-loads it without a dev box).
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flowwise-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  android-release:
    name: Android release APK
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - uses: android-actions/setup-android@v3

      # Release (minified, unsigned) APK — side-load friendly. Wire a signing
      # config into android/app/build.gradle.kts and set the keystore secrets
      # to produce a signed build instead.
      - name: Build release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: flowwise-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

  web:
    name: Web dashboard typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: web
        run: bun run typecheck

      - name: Build
        working-directory: web
        run: bun run build
